name: Scrape jobs

on:
  schedule:
    # Tier 1 - India boards, top companies and career sites, every 6h.
    - cron: "0 */6 * * *"
    # Daily fresh start at 18:30 UTC = 00:00 IST: a full tier-2 scrape, then
    # every job that scrape did not see is deleted. Same result as emptying
    # the database first, but the site never sits empty while it refills.
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Refresh tier (1 = hot boards, 2 = everything)"
        required: false
        default: "2"
      discover:
        description: "Also refresh YC list and validate new boards"
        type: boolean
        default: false
      fresh:
        description: "After scraping, delete jobs this run didn't see"
        type: boolean
        default: false
      reset:
        description: "Empty the database completely before scraping (site is empty until it refills)"
        type: boolean
        default: false

# NOTE: Actions disables scheduled workflows after 60 days of repo
# inactivity. The commit step below counts as activity, so a successful
# discovery run keeps this alive by itself.
concurrency:
  group: scrape-jobs
  cancel-in-progress: false

permissions:
  # required so the discovery job can commit companies.yaml back
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # ~2,900 employer boards plus the big career sites; a full run is
    # 20-35 min on GitHub's network. Headroom so a slow day isn't cut off.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # --- coverage growth (opt-in; writes companies.yaml) ---------------
      # companies.yaml and yc_index.json ARE the product: 800+ verified
      # boards. The runner filesystem is thrown away, so anything discovered
      # here must be committed back or it is lost on every run.
      - name: Refresh YC companies
        if: inputs.discover
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.pipeline.cli yc --apply

      - name: Validate candidate boards
        if: inputs.discover
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.pipeline.cli validate --apply

      - name: Commit discovered boards
        if: inputs.discover
        working-directory: .
        run: |
          if git diff --quiet backend/companies.yaml backend/yc_index.json; then
            echo "no coverage changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/companies.yaml backend/yc_index.json
          git commit -m "chore: refresh ATS board coverage [skip ci] [skip render]"
          git push

      # --- manual full wipe (opt-in only) -------------------------------
      - name: Reset database
        if: inputs.reset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.pipeline.cli reset --yes

      # --- scrape every source -------------------------------------------
      - name: Scrape jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          TIER="${{ inputs.tier }}"
          # the 00:00 IST cron does the full sweep, the 6-hourly one stays hot
          if [ -z "$TIER" ]; then
            if [ "${{ github.event.schedule }}" = "30 18 * * *" ]; then TIER=2; else TIER=1; fi
          fi
          FRESH=""
          if [ "${{ github.event.schedule }}" = "30 18 * * *" ] || [ "${{ inputs.fresh }}" = "true" ]; then
            FRESH="--fresh"
          fi
          echo "scraping tier $TIER $FRESH"
          python -m app.pipeline.cli scrape --tier "$TIER" $FRESH -v

      - name: Health summary
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.pipeline.cli health
